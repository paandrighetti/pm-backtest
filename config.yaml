# Walk-forward configuration. Everything a reader needs to reproduce the report is here.
data_dir: data
split_date: "2026-06-01"      # markets resolved before this date are in sample
min_trades: 30                # a parameter set needs this many in-sample trades to be selectable

costs:
  venue: polymarket           # polymarket | kalshi (kalshi applies the 0.07 p(1-p) taker fee)
  half_spread: 0.01           # crossed on every entry, in probability units
  slippage: 0.0
  spot_fee_bps: 5             # taker fee on the spot hedge leg

universe:
  min_volume: 10000
  exclude_voided: true

strategies:
  favorite_carry:
    grid:
      threshold: [0.90, 0.95, 0.98]
      max_days: [1, 3, 7]   # history is fetched 7 days before resolution, so 30 would equal 7
      min_hours: [1]
      side: [best]
  dutch_book:
    grid:
      threshold: [0.0, 0.01, 0.02]
      max_stale_h: [2]
  binary_hedge:
    grid:
      threshold: [0.03, 0.05, 0.10]
      rebalance_h: [1, 6, 24]
      cap_dollar_delta: [5]
      vol_lookback_d: [30]
