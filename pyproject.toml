[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-backtest"
version = "0.1.0"
description = "Walk-forward backtests of known prediction-market strategies on resolved Polymarket markets"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client>=0.9",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pmbt-ingest = "pmbt.ingest:main"
pmbt-report = "pmbt.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
